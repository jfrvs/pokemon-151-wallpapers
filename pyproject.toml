[project]
name = "pokewall"
version = "0.1.0"
description = "Extract Pokemon Yellow sprites and generate custom wallpapers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=13.0.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
