[project]
name = "pokewall"
version = "0.1.0"
description = "Streamlit project to allow sprite extraction from Pokemon Yellow ROMs + Wallpaper creation and customization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
